name: CI/CD Pipeline for Project TermXtract

on:
  push:
    branches:
      - main  # Trigger the workflow on any push to the main branch
  pull_request:
    branches:
      - main  # Trigger the workflow on PRs to main
  workflow_dispatch:  # Allows manual triggers from the Actions tab

permissions:
  contents: read

# Cancel superseded runs on the same PR; never cancel runs on main
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install "poetry>=2,<3"
          poetry install --with dev

      - name: Lint (ruff)
        run: poetry run ruff check termxtract tests

      - name: Check formatting (ruff format)
        run: poetry run ruff format --check termxtract tests

      - name: Type check (mypy)
        run: poetry run mypy termxtract

  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          # One leg installs the transformers extra, reports coverage and builds the docs
          - os: ubuntu-latest
            python-version: "3.11"
            full: true
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install "poetry>=2,<3"
          poetry install --with dev ${{ matrix.full && '--extras transformers' || '' }}

      # The WordNet lexicon used by the AdaBoost extractor
      - name: Cache WordNet data
        uses: actions/cache@v4
        with:
          path: ~/.wn_data
          key: wn-oewn-2025plus

      - name: Download WordNet lexicon
        run: poetry run python -m wn download oewn:2025+

      - name: Run tests with coverage
        run: poetry run coverage run -m unittest discover tests

      - name: Report coverage
        if: matrix.full
        run: |
          poetry run coverage report
          poetry run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Build MkDocs site
        if: matrix.full
        run: poetry run mkdocs build --strict  # Builds the site in 'site/' directory

      - name: Upload to GitHub Pages artifact
        if: matrix.full && github.ref == 'refs/heads/main'  # Upload only on main
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: [lint, test]
    if: github.ref == 'refs/heads/main'  # Never deploy from pull requests
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
