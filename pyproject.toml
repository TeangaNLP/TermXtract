[project]
name = "termxtract"
version = "0.1.0"
description = "Automatic term extraction (ATE) from plain text or Teanga corpora, with unsupervised and supervised methods."
authors = [
    { name = "Shubhanker Banerjee", email = "shubcode1@gmail.com" },
]
maintainers = [
    { name = "John McCrae", email = "john@mccr.ae" },
]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10,<4.0"
keywords = ["terminology extraction", "automatic term extraction", "ATE", "NLP", "Teanga"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "teanga>=0.1.0,<0.2.0",
    "scikit-learn>=1.3.0,<2.0.0",
    "wn>=1.1,<2.0",
    "numpy>=1.24.0,<2.0.0",
]

[project.optional-dependencies]
transformers = [
    "torch>=1.13.0",
    "transformers>=4.41.0,<5.0.0",
    "accelerate>=1.5.2",
    "sacremoses>=0.0.53",
]

[project.urls]
Homepage = "https://teanga.io/TermXtract/"
Documentation = "https://teanga.io/TermXtract/"
Repository = "https://github.com/TeangaNLP/TermXtract"
Issues = "https://github.com/TeangaNLP/TermXtract/issues"

[tool.poetry.group.dev.dependencies]
mkdocs = "^1.6.1"
mkdocs-material = "^9.5.39"
mkdocstrings = {extras = ["python"], version = "^1.0.8", python = ">=3.11"}
ruff = "^0.17.3"
mypy = "^2.4.0"
coverage = {extras = ["toml"], version = "^7.10.0"}

[tool.ruff]
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.coverage.run]
source = ["termxtract"]

[tool.coverage.report]
show_missing = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
