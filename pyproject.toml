[tool.poetry]
name = "termxtract"
version = "0.1.0"
description = ""
authors = ["shubhanker"]
readme = "README.md"
license = "Apache-2.0"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
teanga = "^0.1.0"
scikit-learn = "^1.3.0"
wn = "^1.1"
torch = { version = ">=1.13.0", optional = true }
transformers = { version = "^4.41.0", optional = true }
sacremoses = { version = ">=0.0.53", optional = true }
numpy = "^1.24.0"
accelerate = { version = ">=1.5.2", optional = true }

[tool.poetry.extras]
transformers = ["torch", "transformers", "accelerate", "sacremoses"]

[tool.poetry.group.dev.dependencies]
mkdocs = "^1.6.1"
mkdocs-material = "^9.5.39"
mkdocstrings = {extras = ["python"], version = "^1.0.8", python = ">=3.11"}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
